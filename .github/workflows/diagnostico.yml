name: Diagnóstico del servidor

# Se lanza a mano. Muestra si el cron y las cuentas funcionan, sin datos personales (el repositorio es público):
# los correos y tokens de los mensajes de error se ocultan.
on:
  workflow_dispatch:

jobs:
  estado:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOSTINGER_HOST }}
      PORT: ${{ secrets.HOSTINGER_PORT }}
      USER: ${{ secrets.HOSTINGER_USER }}
      TARGET: ${{ secrets.HOSTINGER_PATH }}
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
    steps:
      - name: Estado
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -p ${PORT:-65002} -o StrictHostKeyChecking=accept-new "$USER@$HOST" "TARGET='$TARGET' bash -s" <<'REMOTE'
          cd "$HOME/$TARGET"
          echo "== Cron =="
          crontab -l 2>/dev/null | grep -c 'schedule:run' | sed 's/^/líneas con schedule:run: /'
          echo "== Estado =="
          php artisan smartgenda:estado
          echo "== Tareas programadas =="
          php artisan schedule:list 2>&1 | head -20
          echo "== Últimos errores del registro (resumidos) =="
          if [ -f storage/logs/laravel.log ]; then
            grep -E '^\[[0-9-]+ [0-9:]+\] [a-z]+\.(ERROR|CRITICAL|ALERT|EMERGENCY)' storage/logs/laravel.log | tail -n 15 \
              | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<correo>/g; s/[A-Za-z0-9_-]{24,}/<token>/g' | cut -c1-260
          else
            echo "(sin registro)"
          fi
          REMOTE
